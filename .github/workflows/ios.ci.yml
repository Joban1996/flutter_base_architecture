name: ios CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign




